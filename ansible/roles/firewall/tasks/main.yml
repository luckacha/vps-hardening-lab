- name: Поставить ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Политики по умолчанию
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: deny }

- name: Открыть 22, 80, 443
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Логирование
  community.general.ufw:
    logging: low

- name: Включить ufw
  community.general.ufw:
    state: enabled
